
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: devpilot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./evaluations:/app/evaluations:ro
    environment:
      DATABASE_URL: sqlite:////app/data/devpilot.db
      EVALUATION_REPORT_PATH: /app/evaluations/live_evaluation_report.json

      
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: devpilot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
