
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: devpilot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/devpilot.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: devpilot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
